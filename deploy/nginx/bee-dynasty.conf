# Фронтенд «Маршруты инженеров» на сервере бэка (рядом с api.bee-dynasty.conf, его не трогаем).
# Статика — /var/www/bee-dynasty/current (симлинк на последний релиз, см. scripts/deploy.sh).
# /api/ проксируется в тот же контейнер бэка, что и api.bee-dynasty.ru: один origin, CORS не нужен.
# :8443 и :9443 — тот же сайт отдельными origin'ами: можно держать три роли залогиненными одновременно.

upstream beeline_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# http → https; ACME-челленджи Let's Encrypt — из webroot
server {
    listen 80;
    listen [::]:80;
    server_name bee-dynasty.ru www.bee-dynasty.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bee-dynasty.ru$request_uri;
    }
}

# www → основной домен
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bee-dynasty.ru;

    ssl_certificate /etc/letsencrypt/live/bee-dynasty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bee-dynasty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bee-dynasty.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name bee-dynasty.ru;

    ssl_certificate /etc/letsencrypt/live/bee-dynasty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bee-dynasty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bee-dynasty.access.log;
    error_log  /var/log/nginx/bee-dynasty.error.log;

    root /var/www/bee-dynasty/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API бэка — тот же сервер
    location /api/ {
        proxy_pass http://beeline_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    # сборка Vite: имена с хешем — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: любой путь приложения → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
